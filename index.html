<script>const ITEMS=[{"id": 1, "question": "49个过程根据十大管理来背", "hint": "整范进成质资沟风采干", "answer": "一、整合管理\n制定项目章程、制定项目管理计划、指导与管理项目工作、管理项目知识、监控项目工作、实\n施整体变更控制、结束项目或阶段\n二、范围管理\n规划范围管理、收集需求、定义范围、创建 WBS、确认范围、控制范围\n三、进度管理\n规划进度管理、定义活动、排列活动顺序、估算活动持续时间、制定进度计划、控制进度\n四、成本管理\n规划成本管理、估算成本、制定预算、控制成本\n五、质量管理\n规划质量管理、管理质量、控制质量\n六、资源管理\n规划资源管理、估算活动资源、获取资源、建设团队、管理团队、控制资源\n七、沟通管理\n规划沟通管理、管理沟通、监督沟通\n八、风险管理\n规划风险管理、识别风险、实施定性风险分析、实施定量风险分析、规划风险应对、实施风险\n应对、监督风险\n九、采购管理\n规划采购管理、实施采购、控制采购\n十、干系人管理\n识别干系人、规划干系人参与、管理干系人参与、监督干系人参与", "sourceMatch": 1.0, "sourceBlock": 1}, {"id": 2, "question": "十一、配置管理过程", "hint": "", "answer": "配置管理计划\n配置识别\n配置控制\n配置状态报告\n配置审计\n配置改进", "sourceMatch": 0.61, "sourceBlock": 15}, {"id": 3, "question": "十二、变更管理过程", "hint": "", "answer": "提出与接受变更申请\n变更初审\n变更方案论证\n变更控制委员会审批\n发出变更通知并组织实施\n变更的实施监控\n变更效果评估\n变更收尾", "sourceMatch": 0.6, "sourceBlock": 13}, {"id": 4, "question": "十三、立项管理过程", "hint": "", "answer": "立项申请\n初步可行性研究\n详细可行性研究\n评估与决策", "sourceMatch": 0.5, "sourceBlock": 11}, {"id": 5, "question": "PMO的类型", "hint": "支控指", "answer": "支持型\n指令型\n控制型", "sourceMatch": 1.0, "sourceBlock": 2}, {"id": 6, "question": "PMO的主要职能", "hint": "", "answer": "对PMO所辖全部项目的共享资源进行管理\n识别和制定项目管理方法，最佳实践和标准\n通过项目审计，监督项目对项目管理标准，政策，程序和模板的合规性\n制定和管理项目政策，程序，模板及其它共享的文件\n对跨项目的沟通进行协调", "sourceMatch": 0.92, "sourceBlock": 2}, {"id": 7, "question": "开发生命周期可分为", "hint": "预迭增混", "answer": "预测型\n迭代型\n增量型\n适应型（敏捷型）\n混合型", "sourceMatch": 1.0, "sourceBlock": 3}, {"id": 8, "question": "项目立项管理一般包括", "hint": "", "answer": "项目建议与立项申请\n项目可行性分析\n项目评估与决策", "sourceMatch": 1.0, "sourceBlock": 4}, {"id": 9, "question": "可行性研究的内容", "hint": "机经社运", "answer": "技术可行性分析\n经济可行性分析\n社会效益可行性分析\n运行环境可行性分析\n其它可行性分析", "sourceMatch": 1.0, "sourceBlock": 5}, {"id": 10, "question": "技术可行性分析一般应考虑的因素包括", "hint": "开人技物", "answer": "进行项目开发风险\n人力资源有效性\n技术能力可能性\n物资产品可用性", "sourceMatch": 1.0, "sourceBlock": 6}, {"id": 11, "question": "经济可行性分析具体包括", "hint": "支收投敏", "answer": "支出分析\n收益分析\n投资回报分析\n敏捷性分析", "sourceMatch": 1.0, "sourceBlock": 7}, {"id": 12, "question": "项目建议书的内容", "hint": "", "answer": "项目必要性\n项目的市场预测\n产品方案或服务的市场预测\n项目建议必要条件", "sourceMatch": 0.92, "sourceBlock": 4}, {"id": 13, "question": "项目评估的程序", "hint": "组调分编专定", "answer": "成立评估小组，进行分工，制定评估工作计划\n开展研究和调查\n分析和评估\n编制，讨论，修改评估报告\n召开专家论证会\n评估报告的定稿和发布", "sourceMatch": 1.0, "sourceBlock": 8}, {"id": 14, "question": "制定项目章程主要作用包括", "hint": "", "answer": "明确纸质目标和战略目标之间直接联系\n确立项目正式的地位\n展示组织对项目的承诺", "sourceMatch": 1.0, "sourceBlock": 9}, {"id": 15, "question": "项目章程内容", "hint": "目的目标需求要描述，风险度财务名单要审批，退出两个职权", "answer": "项目目的\n可测量项目目标及相关成功标准\n高层级需求，高层级描述，边界定义及主要可交付成果\n项目整体风险\n总体里程碑进度计划\n预先批准财务资源\n关键干系人名单\n项目审批要求\n项目退出标准\n委派项目经理及其职权和职责\n发起人或批准项目章程人员姓名和职权", "sourceMatch": 0.92, "sourceBlock": 9}, {"id": 16, "question": "问题日志的内容", "hint": "问分责期", "answer": "问题类型\n问题提出者或提出日期\n问题描述\n问题优先级\n问题由谁负责解决\n目标解决日期\n问题状态\n最终结局情况", "sourceMatch": 1.0, "sourceBlock": 10}, {"id": 17, "question": "项目管理计划的内容", "hint": "变配鸡生发财", "answer": "九大管理子计划（需求管理计划）\n三大基准（进度，成本，范围）\n变更管理计划\n配置管理计划\n绩效测量基准\n项目生命周期\n开发方法\n管理审查", "sourceMatch": 1.0, "sourceBlock": 11}, {"id": 18, "question": "知识管理过程通常包括", "hint": "管分", "answer": "知识获取与集成\n知识组织与储存\n知识分享\n知识转移与应用\n知识管理审计", "sourceMatch": 1.0, "sourceBlock": 12}, {"id": 19, "question": "变更流程", "hint": "提影通审实验分", "answer": "提出变更申请\n变更影响分析\n通知所有干系人\n变更审批\n变更实施\n变更验证与发布\n分发新文档", "sourceMatch": 1.0, "sourceBlock": 13}, {"id": 20, "question": "范围管理计划的内容", "hint": "制详审正", "answer": "制定项目范围说明书\n根据详细项目说明书创建WBS\n确定如何审批和维护范围基准\n正式验收已完成可交付成果", "sourceMatch": 1.0, "sourceBlock": 14}, {"id": 21, "question": "需求管理计划的主要内容包括", "hint": "跟跟处配置", "answer": "如何规划，跟踪和报告各需求活动\n配置管理活动\n需求优先级排序过程\n测量指标以及使用这些指标理由\n反映那些需求属性将列入跟踪矩阵", "sourceMatch": 1.0, "sourceBlock": 15}, {"id": 22, "question": "需求文件的类别一般包括", "hint": "业功非过", "answer": "1）业务需求\n2）干系人需求\n3）解决方案需求\n4）过度和就绪需求\n5）项目需求\n6）质量需求", "sourceMatch": 1.0, "sourceBlock": 16}, {"id": 23, "question": "需求跟踪矩阵的内容包括", "hint": "两个目标、成果、需求-设计-开发-测试", "answer": "业务需要、机会、目的和目标；\n项目目标\n项目范围和 WBS 可交付成果\n产品设计\n产品开发\n测试策略和测试场景\n高层级需求到详细需求\n【助记：两个目标、成果、需求-设计-开发-测试（软件开发过程）】", "sourceMatch": 1.0, "sourceBlock": 17}, {"id": 24, "question": "制订进度计划包括以下4个关键步骤", "hint": "排估确制", "answer": "1）定义项目里程碑,识别活动并排列活动顺序,以及估算活动持续时间，并确定活动的开始和完\n成日期；\n2）由分配至各个活动的项目人员审查其被分配的活动；\n3）项目人员确认开始和完成日期与资源日历和其他项目或任务没有冲突,从而确认计划日期的\n有效性;\n4）分析进度计划，确定是否存在逻辑关系冲突，以及在批准进度计划并将其作为基准之前是\n否需要资源平衡，并同步修订和维护项目进度模型，确保进度计划在整个项目期间一直切实可行。", "sourceMatch": 1.0, "sourceBlock": 18}, {"id": 25, "question": "资源优化技术包括资源平衡和资源平滑", "hint": "平衡平滑", "answer": "1、资源平衡:为了在资源需求与资源供给之间取得平衡，根据资源制约因素对开始日期和完成\n日期进行调整的一种技术。资源平衡往往导致关键路径改变。\n2、资源平滑:对进度模型中的活动进行调整，从而使项目资源需求不超过预定的资源限制的一\n种技术资源平滑不会改变项目的关键路径，完工日期也不会延迟。但资源平滑技术可能无法实\n现所有资源的优化。", "sourceMatch": 1.0, "sourceBlock": 19}, {"id": 26, "question": "进度压缩技术有哪些", "hint": "赶快", "answer": "1、赶工:通过增加资源，以最小的成本代价来压缩进度工期的一种技术。可能导致风险和/或\n成本的增加。\n2、快速跟进:快速跟进是一种进度压缩技术，将正常情况下按顺序进行的活动或阶段改为至少\n部分并行开展。可能造成返工和风险增加。增加质量风险，可能增加项目成本。", "sourceMatch": 1.0, "sourceBlock": 20}, {"id": 27, "question": "项目进度计划图形方式包括", "hint": "横网里里程", "answer": "横道图\n里程碑图\n项目进度网络图", "sourceMatch": 1.0, "sourceBlock": 21}, {"id": 28, "question": "成本基准", "hint": "分时总", "answer": "是经过批准的、按时间段分配的项目预算，不包括任何管理储备，只有通过正式的变\n更控制程序才能变更，用作与实际结果进行比较的依据，成本基准是不同进度活动经批准的预\n算的总和。", "sourceMatch": 1.0, "sourceBlock": 22}, {"id": 29, "question": "缩短活动的工期的方法有哪些", "hint": "赶快使减改为加", "answer": "1、赶工，投入更多的资源或增加工作时间，以缩短关键活动的工期;\n2、快速跟进，并行施工，以缩短关键路径的长度;\n3、使用高素质的资源或经验更丰富的人员;\n4、减少活动范围或降低活动要求，前提是需要用户同意;\n5、改进方法或技术，以提高生产效率;\n6、加强质量管理，及时发现问题，减少返工，从而缩短工期。\n【助记：赶快使减改为加】", "sourceMatch": 1.0, "sourceBlock": 23}, {"id": 30, "question": "质量成本", "hint": "一(预防)致(评估)不(内部故障)致(外部故障)", "answer": "一致性成本：预防成本（设备、培训、文件过程、完成时间）\n评估成本（检查、测试、破坏性试验损失）\n不一致成本：内部失败成本（报废、返工）\n外部失败成本（债务、失去业务、保修工作）", "sourceMatch": 1.0, "sourceBlock": 24}, {"id": 31, "question": "详细的项目范围说明书包括的内容", "hint": "产可验责", "answer": "1） 产品范围描述 2）可交付成果 3）验收标准 4）项目的除外责任\n【助记：产可验责】", "sourceMatch": 1.0, "sourceBlock": 25}, {"id": 32, "question": "分解活动的步骤", "hint": "工牌分配恰当", "answer": "识别和分析可交付成果及相关工作；\n确定 WBS 的结构和编排方法\n自上而下逐层细化分解；\n为 WBS 组成部分制定和分配标识编码；\n核实可交付成果分解的程度是否恰当；\n【助记：工牌分配恰当】", "sourceMatch": 1.0, "sourceBlock": 26}, {"id": 33, "question": "WBS 结构形式", "hint": "层提", "answer": "生命周期做为第二层；主要可交付物做为第二层。", "sourceMatch": 1.0, "sourceBlock": 27}, {"id": 34, "question": "在分解的过程中注意的8个事项", "hint": "面向成果、符合范围、支持计控、4-6层、管理分包、全体参与、并非不变", "answer": "1）WBS 必须是面向可交付成果的；\n2）WBS 必须符合项目的范围；\n3）WBS 的底层应该支持计划和控制；\n4）WBS 的元素必须有人负责，而且只由一个人负责；\n5）WBS 应控制在4~6 层。一个工作单元只能从属于某个上层单元，避免交叉从属。\n6）WBS 应包括项目管理工作，也要包括分包出去的工作。\n7）WBS 的编排需要所有（主要）项目干系人的参与。\n8）WBS 并非一成不变。\n【助记：面向成果、符合范围、支持计控、4-6 层、管理分包、全体参与、并非不变】", "sourceMatch": 1.0, "sourceBlock": 28}, {"id": 35, "question": "范围基准", "hint": "范说W字", "answer": "是经过批准的范围说明书、WBS 和相应的 WBS 字典", "sourceMatch": 1.0, "sourceBlock": 29}, {"id": 36, "question": "WBS 字典中的内容一般包括", "hint": "工标责资", "answer": "账户编码标识、工作描述、假设条件和制约因素、负责的组织、进度里程碑、相关的进度活动、\n所需资源、成本估算、质量要求、验收标准、技术参考文献和协议信息等", "sourceMatch": 1.0, "sourceBlock": 30}, {"id": 37, "question": "确认范围时需要检查的问题", "hint": "可确认里程碑，质量标准清晰表达，没有遗漏范围风险", "answer": "•可交付成果是否是确定的、可确认的；\n•每个可交付成果是否有明确的里程碑；\n•是否有明确的质量标准；\n•审核和承诺是否有清晰的表达；\n•项目范围是否覆盖了需要完成的产品或服务的所有活动，有没有遗漏或错误；\n•项目范围的风险是否太高。\n【总结助记：可确认里程碑，质量标准清晰表达，没有遗漏范围风险】", "sourceMatch": 1.0, "sourceBlock": 31}, {"id": 38, "question": "确认范围的一般步骤如下", "hint": "时间投入标准，两个会议", "answer": "（1） 确定需要进行范围确认的时间\n（2） 识别范围确认需要哪些投入\n（3） 确定范围正式被接受的标准和要素\n（4） 确定范围确认会议的组织步骤\n（5） 组织范围确认会议\n【总结助记：时间投入标准，两个会议】", "sourceMatch": 1.0, "sourceBlock": 32}, {"id": 39, "question": "确认范围过程与控制质量过程的不同", "hint": "控质前，确范后", "answer": "确认范围关注可交付成果的验收\n控制质量关注可交付成果的正确性及是否满足质量要求\n控制质量过程通常先于确认范围过程，但二者也可同时进行。", "sourceMatch": 1.0, "sourceBlock": 33}, {"id": 40, "question": "干系人关注点的不同", "hint": "项商管工", "answer": "•管理层主要关注项目范围：是指范围对项目的进度、资金和资源的影响，这些因素是否超过了组织\n承受范围，是否在投入产出上具有合理性。\n•客户主要关注产品范围：关心项目的可交付成果是否足够完成产品或服务。\n•项目管理人员主要关注项目制约因素：关心项目可交付成果是否足够和必须完成，时间、资金和资\n源是否足够，主要的潜在风险和预备解决的方法。\n•项目团队成员主要关注项目范围中自己参与的元素和负责的元素。自己的工作时间是否足够，是否\n有多项工作，是否有冲突等。", "sourceMatch": 1.0, "sourceBlock": 34}, {"id": 41, "question": "范围蔓延", "hint": "未管就变", "answer": "未经控制的产品或项目范围的扩大（未对时间、成本和资源做相应调整）", "sourceMatch": 1.0, "sourceBlock": 35}, {"id": 42, "question": "质量管理计划的内容一般包括", "hint": "标准目标，角色审查活动，工具程序", "answer": "项目采用的质量标准；\n项目的质量目标；\n质量角色与职责；\n需要质量审查的项目可交付成果和过程；\n为项目规划的质量控制和质量管理活动；\n项目使用的质量工具；\n与项目有关的主要程序\n【总结助记：标准目标，角色审查活动，工具程序】", "sourceMatch": 1.0, "sourceBlock": 36}, {"id": 43, "question": "质量测量指标的例子包括", "hint": "准准失安", "answer": "按时完成的任务的百分比\n以 CPI测量的成本绩效\n故障率、识别的日缺陷数量\n每月总停机时间\n每个代码行的错误\n客户满意度分数\n以及测试计划所涵盖的需求的百分比", "sourceMatch": 1.0, "sourceBlock": 37}, {"id": 44, "question": "管理质量过程的作用", "hint": "提信，防缺", "answer": "1）通过执行有关产品特定方面的设计准则，设计出最优的，成熟的产品。\n2）建立信心，相信通过质量保证工具和技术可以使输出在完工时满足特定的需求和期望。\n3）确保使用质量过程并确保其使用能够满足项目的质量目标。\n4）提高过程和活动的效率与效果，获得更好的成果和绩效并提高干系人满意度。", "sourceMatch": 1.0, "sourceBlock": 38}, {"id": 45, "question": "管理质量过程的主要工作包括", "hint": "数过规", "answer": "1）执行质量管理计划中规划的质量管理活动；\n2）把质量标准和质量测量指标转化成测试与评估文件，供控制质量过程使用。\n3）根据风险评估报告识别与处置项目质量目标的机会和威胁，以便提出必要的变更请求。\n4）根据质量控制测量结果评价质量管理绩效及质量管理体系的合理性，提出必要的变更请求，\n实现过程改进。\n5）质量管理持续优化改进。\n6）编制质量报告，并向项目干系人报告项目质量绩效。、", "sourceMatch": 1.0, "sourceBlock": 39}, {"id": 46, "question": "质量审计目标一般包括", "hint": "找好的，找不好的，分享好的，提供协助，强调积累", "answer": "识别全部正在实施的良好及最佳实践；\n识别所有违规做法，差距及不足；\n分享所在组织或行业中类似项目的良好实践；\n积极主动的提供帮助，以改进过程的执行，从而帮助团队提高生产效率；\n强调每次审计都应对组织经验教训知识库的积累做出贡献。\n【总结助记：找好的，找不好的，分享好的，提供协助，强调积累】", "sourceMatch": 1.0, "sourceBlock": 40}, {"id": 47, "question": "资源管理计划", "hint": "识别获取角色，组织团队培训，建设资源计划", "answer": "(1)识别资源。用于识别和量化项目所需的团队和实物资源的方法。\n(2)获取资源。关于如何获取项目所需的团队和实物资源的指南。\n(3)角色与职责。包括：①角色：分配给某人的职务，如土木工程师。②职权：使用项目资源、作出\n决策、签字批准、验收可交付成果并影响他人开展项目工作的权力。③职责：必须履行的职责和工\n作。④能力：为完成项目活动，项目团队成员需具备的技能和才干。\n(4)项目组织图。项目组织图以图形方式展示项目团队成员及其报告关系。\n(5)项目团队资源管理。关于如何定义、配备、管理和最终遣散项目团队资源的指南。\n(6)培训。针对项目成员的培训策略。\n(7)团队建设。建设项目团队的方法。\n(8)资源控制。为项目需求优化实物资源采购而采用的方法\n(9)认可计划。将给予团队成员哪些认可和奖励，以及何时给予。\n【总结助记：识别获取角色，组织团队培训，建设资源计划】", "sourceMatch": 1.0, "sourceBlock": 41}, {"id": 48, "question": "项目资源表现大多数格式属于", "hint": "层责文", "answer": "层级型、矩阵型、文本型", "sourceMatch": 1.0, "sourceBlock": 42}, {"id": 49, "question": "层级型包括", "hint": "工作资源项目", "answer": "工作分解结构 WBS、组织分解结构 OBS、资源分解结构RBS", "sourceMatch": 1.0, "sourceBlock": 43}, {"id": 50, "question": "职责分配矩阵 RAM", "hint": "RACI", "answer": "可确保任何一项任务都只有一个人负责，从而避免职权不清，RAM 的一\n个例子是 RACI（执行、负责、咨询、知情）矩阵", "sourceMatch": 1.0, "sourceBlock": 44}, {"id": 51, "question": "团队章程包括", "hint": "核信方解", "answer": "团队价值观、沟通指南、决策标准和过程、冲突处理过程、会议指南、团队共识", "sourceMatch": 1.0, "sourceBlock": 45}, {"id": 52, "question": "可实现团队高效运行的行为主要包括", "hint": "开坦管信", "answer": "使用开放与有效的沟通 ● 创造团队建设机遇\n建立团队成员间的信任 ● 以建设性方式管理冲突\n鼓励合作型的问题解决方法 ● 鼓励合作型的决策方法", "sourceMatch": 1.0, "sourceBlock": 46}, {"id": 53, "question": "建设项目团队的目标包括", "hint": "提竞提合", "answer": "提高团队成员的知识和技能：以提高他们完成项目可交付成果的能力，并降低成本、缩短\n工期和提高质量。\n提高团队成员之间的信任和认同感：以提高士气、减少冲突和增进团队协作。\n创建富有生气、凝聚力和协作性的团队文化：一是提高个人和团队生产效率，振奋团队精\n神，促进团队合作；二是促进团队成员之间的交叉培训和辅导，已分享知识和经验。\n提高团队参与决策的能力：使他们承担起对解决方案的责任，从而提高团队的生产效率，\n获得更有效和高效的成果等。", "sourceMatch": 1.0, "sourceBlock": 47}, {"id": 54, "question": "塔克曼阶段理论(团队发展的模型)", "hint": "成正规发散", "answer": "）中提出团队建设通常要五个阶段进行：\n（1）形成阶段 （2）震荡阶段 （3）规范阶段 （4）成熟阶段 （5）解散阶段\n【助记：成正规发散】", "sourceMatch": 1.0, "sourceBlock": 48}, {"id": 55, "question": "评价团队有效性的指标包括", "hint": "小能低", "answer": "个人技能的改进，从而使成员更有效的完成工作任务；\n团队能力的改进，从而使团队成员更好地开展工作；\n团队成员离职率的降低；\n团队凝聚力的加强，从而使团队成员公开分享信息和经验，并互相帮助来提高项目绩效。", "sourceMatch": 1.0, "sourceBlock": 49}, {"id": 56, "question": "建设团队的工具(或活动)", "hint": "集团可训人", "answer": "）：\n集中办公、人际关系与团队技能、认可与奖励、培训、个人和团队评估\n【助记：集团可训人】", "sourceMatch": 1.0, "sourceBlock": 50}, {"id": 57, "question": "管理团队的主要工作包括", "hint": "管解评", "answer": "在管理团队的过程中，分析冲突背景，原因和阶段，采用适当方法解决冲突；\n考核团队绩效并向成员反馈考核结果；\n持续评估工作职责的落实情况\n持续评估团队成员的技能并提出改进建议\n发现、分析和解决成员之间的误解，发现和纠正违反基本规则的言行\n对于虚拟团队，则还要持续评估虚拟团队成员参与的有效性。", "sourceMatch": 1.0, "sourceBlock": 51}, {"id": 58, "question": "冲突的来源", "hint": "资需排", "answer": "资源稀缺\n进度优先级排序\n个人工作风格差异", "sourceMatch": 1.0, "sourceBlock": 52}, {"question": "冲突的发展阶段", "hint": "潜感受呈结", "answer": "潜伏阶段\n感知阶段\n感受阶段\n呈现阶段\n结束阶段", "sourceMatch": 1.0, "sourceBlock": 52, "id": 59}, {"id": 60, "question": "常用的冲突解决方法如下", "hint": "不能撤退和妥协，只能强迫合作", "answer": "撤退/回避 ● 缓和/包容 ● 妥协/调解 ● 强迫/命令 ● 合作/解决问题\n【助记：不能撤退和妥协，只能强迫合作】", "sourceMatch": 1.0, "sourceBlock": 53}, {"id": 61, "question": "沟通渠道计算", "hint": "n(n-1)/2", "answer": "计算公式：N(N-1）/2；例如：项目组共 5人，渠道数=5（5-1）/2=10", "sourceMatch": 1.0, "sourceBlock": 54}, {"id": 62, "question": "沟通方法主要包括", "hint": "交推拉", "answer": "互动、推式沟通、拉式沟通", "sourceMatch": 1.0, "sourceBlock": 55}, {"id": 63, "question": "沟通管理计划主要包括", "hint": "需求详细上报；发布时沟通保密；接收技术资源优化；术语流向制约", "answer": "干系人的沟通需求\n需沟通的信息，包括语音、形式、内容和详细程度\n上报步骤\n发布信息的原因\n发布所需信息，确认已收到，或做出回应的时限和频率\n负责沟通相关信息的人员\n负责授权保密信息发布的人员\n接受信息的人员和群体\n用于传递信息的方法或技术\n为沟通活动分配的资源，包括时间和预算\n随着项目进展而更新与优化沟通管理计划的方法\n通用术语表\n项目信息流向图，工作流程，报告清单和会议计划等\n来自法律法规、技术、组织政策等的制约因素等。\n【总结助记：需求详细上报；发布时沟通保密；接收技术资源优化；术语流向制约】", "sourceMatch": 1.0, "sourceBlock": 56}, {"id": 64, "question": "项目沟通记录主要包括", "hint": "时内源", "answer": "绩效报告，可交付成果的状态，进度进展，产生的成本，演示，以及干系人需要的其他信息。", "sourceMatch": 1.0, "sourceBlock": 57}, {"id": 65, "question": "监督沟通", "hint": "确保实", "answer": "是确保满足项目及其干系人的信息需求的过程。本过程的主要作用是按沟通管理计划和干系人参与\n计划的要求优化信息传流程。", "sourceMatch": 1.0, "sourceBlock": 58}, {"id": 66, "question": "项目干系人的主要类别通常包括", "hint": "项顾执", "answer": "项目客户和用户，项目团队及成员，项目发起人，资源或职能部门，供应商，以及其他相关组织或\n个人等", "sourceMatch": 1.0, "sourceBlock": 59}, {"id": 67, "question": "干系人的利害关系组合主要包括", "hint": "利权影迫", "answer": "兴趣、权力、所有权、知识、贡献", "sourceMatch": 1.0, "sourceBlock": 60}, {"id": 68, "question": "干系人分类方法", "hint": "权方凸影", "answer": "作用影响方向、干系人立方体、凸显模型、影响方向、优先级排序\n权力/利益方格：", "sourceMatch": 1.0, "sourceBlock": 61}, {"id": 69, "question": "干系人分类方法影响方向", "hint": "向向向向", "answer": "向上：客户、高级管理员\n向下：团队专家\n向外：供应商、政府机构、公众\n横向：项目经理同级人员", "sourceMatch": 1.0, "sourceBlock": 62}, {"id": 70, "question": "干系人的信息,主要包括", "hint": "身评类", "answer": "身份信息、评估信息、干系人分类", "sourceMatch": 0.95, "sourceBlock": 63}, {"id": 71, "question": "干系人参与度评估矩阵", "hint": "不抵中支领", "answer": "C 代表每个干系人的当前参与水平，D是项目团队评估出来的（期望的）\n干系人参与水平可分为如下几种：\n不了解型 ● 抵制型 ● 中立型 ● 支持型 ● 领导型", "sourceMatch": 1.0, "sourceBlock": 64}, {"id": 72, "question": "干系人参与计划", "hint": "现期策略", "answer": "主要包括调动干系人个人或群体参与的特定策略或方法。", "sourceMatch": 1.0, "sourceBlock": 65}, {"id": 73, "question": "管理干系人参与", "hint": "提支抗", "answer": "是与干系人进行沟通和协作以满足其需求与期望，处理问题，并促进干系人合理\n参与的过程。本过程的主要作用：让项目经理能够提高干系人的支持，并尽可能降低干系人的抵制。", "sourceMatch": 1.0, "sourceBlock": 66}, {"id": 74, "question": "在管理干系人参与过程中,需要开展多项活动", "hint": "经引协解", "answer": "在适当的项目阶段引导干系人参与，以便获取，确认或维持他们对项目成功的持续承诺；\n通过谈判和沟通的方式管理干系人期望；\n处理与干系人管理有关的任何风险或潜在关注点，预测干系人可能在未来引发的问题；\n澄清和解决已识别的问题等", "sourceMatch": 0.93, "sourceBlock": 67}, {"id": 75, "question": "监督干系人参与", "hint": "监策效", "answer": "是监督项目干系人关系，并通过修订参与策略和计划来引导干系人合理参与项\n目的过程。本过程的主要作用是，随着项目进展和环境变化，维持或提升干系人参与活动的效率和\n效果。", "sourceMatch": 1.0, "sourceBlock": 68}, {"id": 76, "question": "招标文件使用不同文件的条件如下", "hint": "邀报建", "answer": "信息邀请书（RFI） ● 报价邀请书（RFQ） ● 建议邀请书（RFP）", "sourceMatch": 1.0, "sourceBlock": 69}, {"id": 77, "question": "合同分类（按项目范围划分）", "hint": "总单成", "answer": "项目总承包合同\n项目单项承包合同\n项目分包合同", "sourceMatch": 1.0, "sourceBlock": 70}, {"id": 78, "question": "订立项目分包合同必须同时满足以下5个条件", "hint": "认可非主体资质，不能转包分包", "answer": "经过买方认可；\n分包的部分必须是项目非主体工作；\n只能分包部分项目，而不能转包整个项目；\n分包方必须具备相应的资质条件；\n分包方不能再次分包。\n【总结助记：认可非主体资质，不能转包分包】", "sourceMatch": 1.0, "sourceBlock": 71}, {"id": 79, "question": "合同分类（按项目付款方式划分）", "hint": "总成功", "answer": "总价合同\n成本补偿合同\n工料合同", "sourceMatch": 1.0, "sourceBlock": 72}, {"id": 80, "question": "合同签订时注意的主要内容及条款", "hint": "名称内容，质量计划，期限保密，风险归属，验收价款，违约争议，术语", "answer": "(1)项目名称。\n(2)标的内容和范围。\n(3)项目的质量要求。\n(4)项目的计划、进度、地点、地域和方式。\n(5)项目建设过程中的各种期限。\n(6)技术情报和资料的保密。\n(7)风险责任的承担\n(8)技术成果的归属。\n(9)验收的标准和方法。\n(10)价款、报酬(或使用费)及其支付方式。\n(11)违约金或者损失赔偿的计算方法。\n(12)解决争议的方法。\n(13)名词术语解释。\n【总结助记：名称内容，质量计划，期限保密，风险归属，验收价款，违约争议，术语】", "sourceMatch": 1.0, "sourceBlock": 73}, {"id": 81, "question": "采购形式一般有", "hint": "招议竞", "answer": "直接采购:直接邀请某一家厂商报价或提交建议书，没有竞争性。\n邀请招标:邀请一些厂家报价或提交建议书，具有限竞争性。\n竞争招标:公开发布招标广告，以便潜在卖方报价或提交建议书，具有很大的竞争性。", "sourceMatch": 1.0, "sourceBlock": 74}, {"id": 82, "question": "实施采购过程包括", "hint": "招投评授", "answer": "招标，投标，评标和授标四个环节", "sourceMatch": 1.0, "sourceBlock": 75}, {"id": 83, "question": "常用的评标方法包括", "hint": "最低权", "answer": "加权打分法 ● 筛选系统 ● 独立估算", "sourceMatch": 1.0, "sourceBlock": 76}, {"id": 84, "question": "采购文档可包括", "hint": "招标投标", "answer": "1）招标文件。招标文件包括发给卖方的信息邀请书，建议邀请书，报价邀请书或其他文件\n2）采购工作说明书。\n3）独立成本估算。独立成体估算可由内部或外部人员\n4）供方选择标准。", "sourceMatch": 1.0, "sourceBlock": 77}, {"id": 85, "question": "合同管理活动可能包括以下5个方面", "hint": "监变索收", "answer": "(1)收集数据和管理项目记录\n(2)完善采购计划和进度计划；\n(3)建立与采购相关的项目数据的收集，并为组织编制定期报告;\n(4)监督采购环境，以便引导或调整实施；\n(5)向卖方付款", "sourceMatch": 1.0, "sourceBlock": 78}, {"id": 86, "question": "风险分类（按照风险后果/来源划分）", "hint": "技外组环", "answer": "按后果：\n纯粹风险（如无任何收益，如失火）和投机风险（可能带来收益）。在一定条件下可以相互转化。风\n险不是零和游戏，有时涉及各方都要蒙受损失，无一幸免\n按照风险来源：\n自然风险：由于自然力的作用，造成财产损毁或人员伤亡的风险属于自然风险。\n人为风险:指由于人的活动而带来的风险。人为风险又可以细分为行为，经济，技术，政策和组织\n风险等。", "sourceMatch": 0.73, "sourceBlock": 79}, {"id": 87, "question": "按照风险的可预测性划分", "hint": "已知乐观的目标变动了；可预测业主分包商机械地质；不可预测地震暴雨膨胀政策", "answer": "已知风险\n可预测风险\n不可预测风险\n（1）已知风险。发生概率高，但一般后果轻微，不严重。如：项目目标不明确，过分乐观的进度\n计划，设计或施工变更和材料价格波动等。【助记：已知乐观的目标变动了】\n（2）可预测风险。可以预见其发生，但不可预见其后果的风险。这类风险的后果有时可能相当严\n重。如：业主不能及时审查批准，分包商不能及时交工，施工机械出现故障，不可预见的地质条件\n等。【助记：可预测业主分包商机械地质（两人一机一地）】\n（3）不可预测风险。有可能发生，但即使最有经验的人亦不能预见的风险。也称未知风险或未识\n别的风险。如地震、百年不遇的暴雨、通货膨胀和政策变化等。\n【助记：不可预测地震暴雨膨胀政策（两自然两经济）】", "sourceMatch": 1.0, "sourceBlock": 80}, {"id": 88, "question": "当完成识别风险过程时,风险登记册的内容主要包括", "hint": "清责应", "answer": "（1）已识别风险的清单。（2）潜在风险责任人。（3）潜在风险应对措施清单", "sourceMatch": 0.98, "sourceBlock": 81}, {"id": 89, "question": "风险报告的主要内容有", "hint": "源概要求", "answer": "1、整体项目风险的来源;\n2、关于已识别的单个项目风险的概述信息;\n3、根据风险管理计划中规定的报告要求的其他信息", "sourceMatch": 1.0, "sourceBlock": 84}, {"id": 90, "question": "威胁应对策略有哪些", "hint": "上规转减接", "answer": "1、上报 2、规避 3、转移 4、减轻 5、接受", "sourceMatch": 1.0, "sourceBlock": 85}, {"id": 91, "question": "机会应对策略有哪些", "hint": "上开分提接", "answer": "1、上报 2、开拓 3、分享 4、提高 5、接受", "sourceMatch": 1.0, "sourceBlock": 86}, {"id": 92, "ques
