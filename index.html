    .table-wrap{border-color:#d7e0eb;border-radius:14px;box-shadow:0 12px 32px rgba(35,52,76,.07)}th{background:#edf3fa;color:#40546d;font-weight:780}.matrix th{background:#eaf1f9}.matrix .domain{background:#f4f7fb}.study-table tbody tr{transition:background .15s}.study-table tbody tr:hover{background:#f8fbff}.study-table td{padding:13px 16px}.study-table textarea{font-size:14px;line-height:1.55}.feedback.show,.hint.show,.answer.show{animation:reveal .18s ease-out}.empty{margin-top:14px;border:1px dashed #cfd9e7;border-radius:14px;background:rgba(255,255,255,.65)}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(49,95,190,.22);outline-offset:2px}@keyframes reveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

    @media(max-width:760px){.page-nav{display:flex;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}.page-nav::-webkit-scrollbar{display:none}.page-tab{min-width:172px}.bar,.controls,main{padding-left:14px;padding-right:14px}.controls{margin-left:14px;margin-right:14px;padding:10px}.toolbar-group{width:100%}.controls select,.controls .search{width:100%}.toolbar-actions{display:grid;grid-template-columns:1fr 1fr}.toolbar-actions .danger{grid-column:1/-1}.table-wrap{max-height:none;border-radius:10px}table{min-width:850px}.matrix{min-width:1120px}.matrix .domain{width:145px}.cell-actions{opacity:1}.brand-mark{width:38px;height:38px}.title-copy h1{font-size:19px}.sub{font-size:11px}}

<body>
  <header class="top"><div class="bar">
    <div class="title-row"><div class="brand"><div class="brand-mark">中</div><div class="title-copy"><h1>中项知识默写练习</h1><div class="sub">五大版块 · 离线使用 · 答题记录自动保存在当前浏览器</div></div></div><div class="stats"><div class="stat primary"><span class="stat-label">当前版块</span><span class="stat-value" id="progressText">已答对 0 / 0</span></div><div class="stat"><span class="stat-label">全部题目</span><span class="stat-value" id="overallText">总进度 0 / 0</span></div></div></div>
    <div class="progress"><i id="progressBar"></i></div>
  </div></header>
  <nav class="page-nav" id="pageNav" aria-label="五大版块"></nav>
  <div class="controls">
    <div class="toolbar-group grow"><select id="statusFilter" aria-label="状态筛选"><option value="all">全部状态</option><option value="todo">未验证</option><option value="wrong">待巩固</option><option value="correct">已答对</option></select><input class="search" id="search" placeholder="搜索考点、缩写或说明"></div>
    <div class="toolbar-group toolbar-actions"><button class="btn primary" id="verifyVisible">验证当前页</button><button class="btn" id="showVisible">显示本页答案</button><button class="btn danger" id="clearAll">清空全部记录</button></div>
  </div>
  <main id="app"></main>
  <script>
  const rawSections = [
    {name:'十大管理', rows:[
      ['项目整合管理','启动过程组','识别干系人'],['项目整合管理','规划过程组','制订项目管理计划'],['项目整合管理','执行过程组','指导与管理项目工作\n管理项目知识'],['项目整合管理','监控过程组','监控项目工作\n实施整体变更控制'],['项目整合管理','收尾过程组','结束项目或阶段'],
      ['项目范围管理','规划过程组','规划范围管理\n收集需求\n定义范围\n创建WBS'],['项目范围管理','监控过程组','确认范围\n控制范围'],
      ['项目进度管理','规划过程组','规划进度管理\n定义活动\n排列活动顺序\n估算活动持续时间\n制订进度计划'],['项目进度管理','监控过程组','控制进度'],
      ['项目成本管理','规划过程组','规划成本管理\n估算成本\n制定预算'],['项目成本管理','监控过程组','控制成本'],
      ['项目资源管理','规划过程组','规划资源管理\n估算活动资源'],['项目资源管理','执行过程组','获取资源\n建设团队\n管理团队'],['项目资源管理','监控过程组','控制资源'],
      ['项目质量管理','规划过程组','规划质量管理'],['项目质量管理','执行过程组','管理质量'],['项目质量管理','监控过程组','控制质量'],
      ['项目沟通管理','规划过程组','规划沟通管理'],['项目沟通管理','执行过程组','管理沟通'],['项目沟通管理','监控过程组','监督沟通'],
      ['项目风险管理','规划过程组','规划风险管理\n识别风险\n实施定性风险分析\n实施定量风险分析\n规划风险应对'],['项目风险管理','执行过程组','实施风险应对'],['项目风险管理','监控过程组','监督风险'],
      ['项目采购管理','规划过程组','规划采购管理'],['项目采购管理','执行过程组','实施采购'],['项目采购管理','监控过程组','控制采购'],
      ['项目干系人管理','启动过程组','识别干系人'],['项目干系人管理','规划过程组','规划干系人参与'],['项目干系人管理','执行过程组','管理干系人参与'],['项目干系人管理','监控过程组','监督干系人参与']
    ]},
    {name:'挣值公式', rows:[
      ['CV｜成本偏差','正值节约，负值超支','CV=EV - AC'],['CPI｜成本绩效指数','＞1绩效好，＜1绩效差','CPI=EV / AC'],['SV｜进度偏差','正值提前，负值落后','SV=EV - PV'],['SPI｜进度绩效指数','＞1提前，＜1落后','SPI=EV / PV'],
      ['ETC｜完工尚需估算（非典型）','偏差不再持续','ETC=BAC - EV'],['ETC｜完工尚需估算（典型）','成本偏差持续','ETC=(BAC - EV) / CPI'],['ETC｜完工尚需估算（综合影响）','同时考虑成本和进度','ETC=(BAC - EV) / (CPI × SPI)'],
      ['EAC｜完工估算（非典型）','偏差不再持续','EAC=AC + (BAC - EV)'],['EAC｜完工估算（典型）','成本偏差持续','EAC=BAC / CPI'],['EAC通用｜完工估算','典型/非典型通用','EAC=AC+ETC'],
      ['VAC｜完工偏差','正值预计节约，负值预计超支','EAC=BAC - EAC'],['TCPI｜按新预算','完工尚需绩效指数','TCPI=(BAC - EV) / (EAC - AC)'],['TCPI｜预算不变','完工尚需绩效指数','TCPI=(BAC - EV) / (BAC - AC)'],
      ['非典型完工工期预测','题目会提供具体数值','实际已用工期 + 剩余工作还需工期'],['典型完工工期预测','','计划总工期 / SPI']
    ]},
    {name:'三点估算', rows:[
      ['三点估算工期（平均值）','加权平均计算','(最大值 + 4×最可能值 + 最小值) / 6'],['三点估算标准差','衡量估算的不确定性','(最大值 - 最小值) / 6'],['三点估算概率范围','正态分布概率','68%: ±1σ, 95%: ±2σ, 99%: ±3σ']
    ]},
    {name:'沟通和加权', rows:[
      ['沟通渠道数量','n为干系人数量，如10人有45条渠道','n(n-1)/2'],['评标加权平均','分数相加 → 除以人数 → 乘以权重 → 全部相加','卖方最终得分 = Σ [ (某个评分项所有打分之和 ÷ 评定人人数) × 该评分项权重 ]']
    ]},
    {name:'成本加激励费用', rows:[
      ['A项目｜实际支付','目标成本10、实际成本8、目标费用1、分摊比例60:40','9.8'],['A项目｜实际利润','目标成本10、实际成本8、目标费用1、分摊比例60:40','1.8'],['B项目｜实际支付','目标成本10、实际成本13、目标费用1、分摊比例60:40','12.8'],['B项目｜实际利润','目标成本10、实际成本13、目标费用1、分摊比例60:40','-0.2'],['总价加激励费用限价规则','','计算结果超过限价后，按最高限价付']
    ]}
  ];
  const questions=rawSections.flatMap((s,si)=>s.rows.map((r,ri)=>({id:`q${si}_${ri}`,section:s.name,title:r[0],desc:r[1],answer:r[2]})));
  const storageKey='mid_exam_formula_dictation_20260721_v1'; let saved={}; try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
  const sectionNames=rawSections.map(s=>s.name);
  const hashSection=decodeURIComponent(location.hash.slice(1));
  const state={section:sectionNames.includes(hashSection)?hashSection:sectionNames[0],status:'all',query:''};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const normalize=s=>String(s||'').toLowerCase().replace(/（/g,'(').replace(/）/g,')').replace(/[×·]/g,'*').replace(/[÷]/g,'/').replace(/[＝]/g,'=').replace(/[＞]/g,'>').replace(/[＜]/g,'<').replace(/[，、；：]/g,'').replace(/[\s,;:。\[\]]+/g,'').replace(/[＋]/g,'+').replace(/[－—–]/g,'-');
  function units(s){return String(s).split(/\n|→|,|，/).map(normalize).filter(Boolean)}
  function score(user,answer){const u=normalize(user),a=normalize(answer);if(!u)return {ok:false,msg:'请先填写答案'}; if(u===a)return {ok:true,msg:'回答正确'};
    const au=units(answer),uu=units(user); const hit=au.filter(x=>uu.some(y=>x===y||y.includes(x)||x.includes(y))).length; const ratio=au.length?hit/au.length:0;
    return ratio>=.999?{ok:true,msg:'回答正确（已忽略空格和常见符号差异）'}:{ok:false,msg:ratio>0?`还不完整：已匹配约 ${Math.round(ratio*100)}%`:'答案不匹配，再回忆一下'};
  }
  function hintFor(a){const parts=String(a).split('\n'); if(parts.length>1)return '关键词首字：'+parts.map(x=>x.trim()[0]||'').join(' → ')+'（共 '+parts.length+' 项）'; const visible=String(a).replace(/[\u4e00-\u9fffA-Za-z0-9σΣ]+/g,w=>w.length<=2?w[0]+'＿':w.slice(0,Math.ceil(w.length/3))+'＿'.repeat(Math.max(2,w.length-Math.ceil(w.length/3)))); return visible;}
  function persist(){localStorage.setItem(storageKey,JSON.stringify(saved))}
  function filtered(){return questions.filter(q=>{const s=saved[q.id]||{};const status=s.result==='ok'?'correct':s.result==='bad'?'wrong':'todo';return q.section===state.section&&(state.status==='all'||state.status===status)&&(!state.query||(q.title+' '+q.desc+' '+q.section).toLowerCase().includes(state.query));})}
  function updateNavStats(){document.querySelectorAll('.page-tab').forEach(tab=>{const list=questions.filter(q=>q.section===tab.dataset.section),ok=list.filter(q=>saved[q.id]?.result==='ok').length;const meta=tab.querySelector('.page-tab-meta');if(meta)meta.textContent=`已掌握 ${ok} / ${list.length}`})}
  function updateProgress(){const pageQuestions=questions.filter(q=>q.section===state.section),pageOk=pageQuestions.filter(q=>saved[q.id]?.result==='ok').length,totalOk=questions.filter(q=>saved[q.id]?.result==='ok').length;document.querySelector('#progressText').textContent=`已掌握 ${pageOk} / ${pageQuestions.length}`;document.querySelector('#overallText').textContent=`总进度 ${totalOk} / ${questions.length}`;document.querySelector('#progressBar').style.width=(pageOk/pageQuestions.length*100)+'%';updateNavStats()}
  function render(){const list=filtered(),app=document.querySelector('#app'); if(!list.length){app.innerHTML='<div class="empty">没有符合当前筛选条件的题目</div>';updateProgress();return}
    const groups=rawSections.map(s=>({name:s.name,items:list.filter(q=>q.section===s.name)})).filter(g=>g.items.length);
    app.innerHTML=groups.map(g=>g.name==='十大管理'?managementGrid(g):regularTable(g)).join('')+'<div class="footer-note">验证时会忽略空格、全半角括号及 × / * 等常见书写差异。</div>';updateProgress();}
  function sectionSummary(name){return ({'挣值公式':'根据指标名称和适用条件，默写对应计算公式。','三点估算':'默写平均值、标准差及正态分布概率范围。','沟通和加权':'掌握沟通渠道数量与评标加权计算方法。','成本加激励费用':'根据合同条件计算实际支付、实际利润及限价规则。'})[name]||''}
  function regularTable(g){return `<section class="section"><div class="section-head"><h2>${esc(g.name)}</h2><span class="count">${g.items.length}题</span></div><div class="section-summary">${esc(sectionSummary(g.name))}</div><div class="table-wrap"><table class="study-table"><thead><tr><th class="col-no">序号</th><th class="col-question">考点</th><th class="col-desc">条件与说明</th><th class="col-input">默写答案</th><th class="col-actions">操作</th></tr></thead><tbody>${g.items.map((q,i)=>row(q,i)).join('')}</tbody></table></div></section>`}
  function managementGrid(g){const domains=['项目整合管理','项目范围管理','项目进度管理','项目成本管理','项目资源管理','项目质量管理','项目沟通管理','项目风险管理','项目采购管理','项目干系人管理'],groups=['启动过程组','规划过程组','执行过程组','监控过程组','收尾过程组'];return `<section class="section"><div class="section-head"><h2>十大管理 × 五大过程组</h2><span class="count">${g.items.length}组</span></div><div class="table-wrap"><table class="matrix"><thead><tr><th class="domain">知识领域</th>${groups.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${domains.map(d=>`<tr><td class="domain">${d}</td>${groups.map(p=>{const q=g.items.find(x=>x.title===d&&x.desc===p);return q?matrixCell(q):'<td></td>'}).join('')}</tr>`).join('')}</tbody></table></div></section>`}
  function matrixCell(q){const s=saved[q.id]||{},answers=q.answer.split('\n'),values=String(s.value||'').split('\n');return `<td class="card matrix-cell ${s.result||''}" data-id="${q.id}">${answers.map((_,i)=>`<input class="dict-input" data-line="${i}" aria-label="${esc(q.title)}${esc(q.desc)}第${i+1}项" placeholder="请输入…" value="${esc(values[i]||'')}">`).join('')}<div class="cell-actions"><button class="btn verify">验证</button><button class="btn hintBtn">助记</button><button class="btn answerBtn">答案</button><button class="btn clearOne">清空</button></div><div class="feedback ${s.result==='ok'?'ok show':s.result==='bad'?'bad show':''}">${esc(s.message||'')}</div><div class="hint">助记：${esc(hintFor(q.answer))}</div><div class="answer"><b>标准答案：</b> ${esc(q.answer)}</div></td>`}
  function row(q,i){const s=saved[q.id]||{};return `<tr class="card ${s.result||''}" data-id="${q.id}"><td class="row-no"><span>${i+1}</span></td><td><div class="question">${esc(q.title)}</div></td><td><div class="desc">${esc(q.desc||'写出对应内容')}</div></td><td><textarea aria-label="${esc(q.title)}的答案" placeholder="请输入公式或答案……">${esc(s.value||'')}</textarea><div class="feedback ${s.result==='ok'?'ok show':s.result==='bad'?'bad show':''}">${esc(s.message||'')}</div><div class="hint">助记：${esc(hintFor(q.answer))}</div><div class="answer"><b>标准答案：</b> ${esc(q.answer)}</div></td><td><div class="actions"><button class="btn verify">验证答案</button><button class="btn hintBtn">助记</button><button class="btn answerBtn">答案</button><button class="btn clearOne">清空</button></div></td></tr>`}
  function readCardValue(card){const fields=[...card.querySelectorAll('textarea,.dict-input')];return fields.map(x=>x.value).join('\n')}
  document.querySelector('#app').addEventListener('input',e=>{if(!e.target.matches('textarea,.dict-input'))return;const card=e.target.closest('.card'),id=card.dataset.id;saved[id]={...(saved[id]||{}),value:readCardValue(card),result:null,message:''};card.classList.remove('ok','bad');persist();updateProgress()});
  document.querySelector('#app').addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;const q=questions.find(x=>x.id===card.dataset.id),value=readCardValue(card);
    if(e.target.classList.contains('verify')){const r=score(value,q.answer);saved[q.id]={value,result:r.ok?'ok':'bad',message:r.msg};persist();card.classList.remove('ok','bad');card.classList.add(r.ok?'ok':'bad');const f=card.querySelector('.feedback');f.textContent=r.msg;f.className='feedback '+(r.ok?'ok':'bad')+' show';updateProgress()}
    if(e.target.classList.contains('hintBtn'))card.querySelector('.hint').classList.toggle('show');
    if(e.target.classList.contains('answerBtn'))card.querySelector('.answer').classList.toggle('show');
    if(e.target.classList.contains('clearOne')){delete saved[q.id];persist();card.querySelectorAll('textarea,.dict-input').forEach(x=>x.value='');card.classList.remove('ok','bad');card.querySelector('.feedback').className='feedback';card.querySelector('.hint').classList.remove('show');card.querySelector('.answer').classList.remove('show');updateProgress()}
  });
  function renderNav(){document.querySelector('#pageNav').innerHTML=sectionNames.map((name,i)=>{const list=questions.filter(q=>q.section===name),ok=list.filter(q=>saved[q.id]?.result==='ok').length;return `<button class="page-tab ${name===state.section?'active':''}" data-section="${esc(name)}"><span class="page-tab-index">${i+1}</span><span class="page-tab-copy"><span class="page-tab-name">${esc(name)}</span><span class="page-tab-meta">已掌握 ${ok} / ${list.length}</span></span></button>`}).join('')}
  document.querySelector('#pageNav').onclick=e=>{const tab=e.target.closest('.page-tab');if(!tab)return;state.section=tab.dataset.section;location.hash=encodeURIComponent(state.section);renderNav();render();scrollTo({top:0,behavior:'smooth'})};
  window.onhashchange=()=>{const name=decodeURIComponent(location.hash.slice(1));if(sectionNames.includes(name)&&name!==state.section){state.section=name;renderNav();render()}};
  document.querySelector('#statusFilter').onchange=e=>{state.status=e.target.value;render()};document.querySelector('#search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();render()};
  document.querySelector('#verifyVisible').onclick=()=>{document.querySelectorAll('.card .verify').forEach(b=>b.click())};document.querySelector('#showVisible').onclick=()=>{document.querySelectorAll('.card .answer').forEach(x=>x.classList.add('show'))};
  document.querySelector('#clearAll').onclick=()=>{if(confirm('确定清空所有填写内容和答题记录吗？')){saved={};localStorage.removeItem(storageKey);render()}};
  renderNav();render();
  </script>
</body>
</html>
